<!DOCTYPE html>
<html lang="en">
<head>
    <title>Google Advanced Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="body_no_margin">
    <div class="advanced_header_1">
        <img class="logo" src="google_advanced_logo.png" alt="Google">
        <a class="refs" href="index.html">Google Search</a>
    </div>
    <div class="advanced_header_2">
        <div class="text">
            Advanced Search
        </div>
    </div>
    <div class="advanced_search">
        <div class="text">
            Find pages with...
        </div>
        <div>
            <form action="https://www.google.com/search">
                <div class="search">
                    <label class="label">all these words:</label>
                    <input class="box" type="text" name="as_q">
                </div>
                <div class="search">
                    <label class="label">this exact word or phrase:</label>
                    <input class="box" type="text" name="as_epq">
                </div>
                <div class="search">
                    <label class="label">any of these words:</label>
                    <input class="box" type="text" name="as_oq">
                </div>
                <div class="search">
                    <label class="label">none of these words:</label>
                    <input class="box" type="text" name="as_eq">
                </div>
                <div>
                    <input class="button" type="submit" value="Advanced Search">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
