{% extends "layout.html" %}

{% block body %}

    <div id="add-form">

        {% if message %}
            <label class="col-form-label-sm error-label" for="error-message">An error occurred:</label>
            <div id="error-message" class="error-message">{{ message }}</div>
        {% endif %}

        <form action="{% url 'add_stock' %}" method="post">
            {% csrf_token %}
            <label class="col-form-label-lg">Add stock</label>
            <div class="form-group">
                <input class="form-control form-control-sm" autofocus required type="text" name="name" placeholder="Name">
            </div>
            <div class="form-group">
                <input class="form-control form-control-sm" required type="text" name="symbol" placeholder="Symbol">
            </div>
            <div class="form-group">
                <select id="exchange" class="form-control form-control-sm" required name="exchange" onchange="toggleCustomInput()">
                    <ul>
                        <option value="">Select exchange</option>
                        {% for exchange in exchanges %}
                            <option value="{{ exchange }}">{{ exchange }}</option>
                        {% endfor %}
                        <option value="other">Other</option>
                    </ul>
                </select>
            </div>
            <div class="form-group">
                <input id="new-exchange" class="form-control form-control-sm" type="hidden" name="new_exchange" placeholder="New exchange">
            </div>
            <div class="form-group">
                <input class="form-control form-control-sm" required type="text" name="ISIN" placeholder="ISIN">
            </div>
            <div class="form-group">
                <select id="currency" class="form-control form-control-sm" required name="currency" onchange="toggleCustomInput()">
                    <ul>
                        <option value="">Select currency</option>
                        {% for currency in currencies %}
                            <option value="{{ currency }}">{{ currency }}</option>
                        {% endfor %}
                        <option value="other">Other</option>
                    </ul>
                </select>
            </div>
            <div class="form-group">
                <input id="new-currency" class="form-control form-control-sm" type="hidden" name="new_currency" placeholder="New currency">
            </div>
            <div class="form-group">
                <input id="watch" type="checkbox" name="watch">
                <label class="col-form-label-sm" for="watch">Add to watchlist</label>
            </div>
            <div id="add-form-buttons">
                <input class="btn btn-primary" type="submit" value="Add">
                <a class="btn btn-primary" href="{% url 'index' %}">Cancel</a>
            </div>
        </form>
    </div>

    <script>
    function toggleCustomInput() {
        const exchange = document.getElementById("exchange");
        const new_exchange = document.getElementById("new-exchange");
        const currency = document.getElementById("currency");
        const new_currency = document.getElementById("new-currency");

        // Only show if "other" is selected
        new_exchange.type = (exchange.value === "other") ? "text" : "hidden";
        new_currency.type = (currency.value === "other") ? "text" : "hidden";
    }
</script>

{% endblock %}
