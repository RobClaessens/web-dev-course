{% extends "layout.html" %}

{% block body %}

    <div id="add-form">

        {% if message %}
            <label class="col-form-label-sm error-label" for="error-message">An error occurred:</label>
            <div id="error-message" class="error-message">{{ message }}</div>
        {% endif %}

        <form action="{% url 'add_transaction' portfolio.id %}" method="post">
            {% csrf_token %}
            <label class="col-form-label-lg">Add transaction</label>
            <div class="form-group">
                <input class="form-control form-control-sm" type="text" name="portfolio" value="{{ portfolio.name }}" readonly>
            </div>
            <div class="form-group">
                <select id="transaction-type" class="form-control form-control-sm" required name="transaction_type" onchange="toggleCustomInput()">
                    <ul>
                        <option value="StockTransaction">Stock transaction</option>
                        <option value="FiatTransaction">Fiat transaction</option>
                    </ul>
                </select>
            </div>
            <div class="form-group">
                <select id="stock" class="form-control form-control-sm" required name="stock" onchange="setCurrency(this)">
                    <ul>
                        <option value="">Select stock</option>
                        {% for stock in stocks %}
                            <option value="{{ stock.id }}" data-currency="{{ stock.currency }}">{{ stock.name }}</option>
                        {% endfor %}
                    </ul>
                </select>
            </div>
            <div class="form-group form-group-radio">
                <input id="buy" type="radio" name="transaction_method" value="buy" checked>
                <label id="buy-label" class="btn btn-primary" for="buy">Buy</label>
                <input id="sell" type="radio" name="transaction_method" value="sell">
                <label id="sell-label" class="btn btn-primary" for="sell">Sell</label>
                <input id="deposit" type="radio" name="transaction_method" value="deposit">
                <label id="deposit-label" class="btn btn-primary" for="deposit" hidden>Deposit</label>
                <input id="withdrawal" type="radio" name="transaction_method" value="withdrawal">
                <label id="withdrawal-label" class="btn btn-primary" for="withdrawal" hidden>Withdrawal</label>
            </div>
            <div class="form-group">
                <input class="form-control form-control-sm" required type="number" min="0" step="0.01" name="amount" placeholder="Amount">
            </div>
            <div id="price-form" class="form-group form-group-currency">
                <input id="price-currency"  class="form-control form-control-sm" required type="text" name="price_currency" value="Currency" disabled>
                <input id="price" class="form-control form-control-sm" required type="number" min="0" step="0.01" name="price" placeholder="Price">
            </div>
            <div class="form-group form-group-currency">
                <input class="form-control form-control-sm" required type="text" name="costs_currency" value="{{ portfolio.currency }}" disabled>
                <input class="form-control form-control-sm" required type="number" min="0" step="0.01" name="costs" placeholder="Costs">
            </div>
            <div class="form-group">
                <input class="form-control form-control-sm" required type="date" min="2023-01-01" name="date">
            </div>
            <div class="form-group">
                <input type="hidden" name="previous" value="{{ previous }}">
            </div>
            <div class="add-form-buttons">
                <input class="btn btn-primary" type="submit" value="Add">
                <a class="btn btn-primary" href="{% url 'portfolios' portfolio.id %}">Cancel</a>
            </div>
        </form>
    </div>

    <script>
    function toggleCustomInput() {
        // Get transaction type
        const transaction_type = document.getElementById("transaction-type");

        // Get dependent elements
        const stock = document.getElementById("stock");
        const price_form = document.getElementById("price-form");
        const price = document.getElementById("price");
        const buy = document.getElementById("buy-label");
        const sell = document.getElementById("sell-label");
        const deposit = document.getElementById("deposit-label");
        const withdrawal = document.getElementById("withdrawal-label");

        // Toggle hidden, required and checked attributes for all radio buttons
        if (transaction_type.value === "StockTransaction") {
            // Hidden
            stock.hidden = false;
            price_form.hidden = false;
            buy.hidden = false;
            sell.hidden = false;
            deposit.hidden = true;
            withdrawal.hidden = true;
            // Required
            stock.required = true;
            price.required = true;
            // Checked, setting one to true will set the others to false
            buy.control.checked = true;
        } else {
            // Hidden
            stock.hidden = true;
            price_form.hidden = true;
            buy.hidden = true;
            sell.hidden = true;
            deposit.hidden = false;
            withdrawal.hidden = false;
            // Required
            stock.required = false;
            price.required = false;
            // Checked, setting one to true will set the others to false
            deposit.control.checked = true;
        }
    }

    function setCurrency(element) {
        // Get selected element and currency attribute
        const selection = element.options[element.selectedIndex];
        const currency = selection.getAttribute('data-currency');

        // Get currency elements
        const price_currency = document.getElementById("price-currency");

        // Update currency dropdowns based on stock currency
        price_currency.value = currency ? currency : "Currency";
    }
    </script>

{% endblock %}
