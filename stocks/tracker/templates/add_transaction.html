{% extends "layout.html" %}

{% block body %}

    <div id="add-form">

        {% if message %}
            <label class="col-form-label-sm error-label" for="error-message">An error occurred:</label>
            <div id="error-message" class="error-message">{{ message }}</div>
        {% endif %}

        <form action="{% url 'add_transaction' portfolio.id %}" method="post">
            {% csrf_token %}
            <label class="col-form-label-lg">Add transaction</label>
            <div class="form-group">
                <input class="form-control form-control-sm" type="text" name="portfolio" value="{{ portfolio.name }}" readonly>
            </div>
            <div class="form-group">
                <!-- TODO: Implement onChange functionality to toggle forms based on transaction type -->
                <select id="transaction-type" class="form-control form-control-sm" required name="transaction_type">
                    <ul>
                        <option value="StockTransaction">Stock transaction</option>
                        <option value="FiatTransaction">Fiat transaction</option>
                        <option value="StockDividend">Stock dividend</option>
                        <option value="FiatDividend">Fiat dividend</option>
                    </ul>
                </select>
            </div>
            <div class="form-group">
                <select id="stock-id" class="form-control form-control-sm" required name="stock_id" onchange="setCurrency(this)">
                    <ul>
                        <option value="">Select stock</option>
                        {% for stock in stocks %}
                            <option value="{{ stock.id }}" data-currency="{{ stock.currency }}">{{ stock.name }}</option>
                        {% endfor %}
                    </ul>
                </select>
            </div>
            <div class="form-group">
                <input class="form-control form-control-sm" required type="number" name="amount" placeholder="Amount">
            </div>
            <div class="form-group form-group-currency">
                <select id="price-currency" class="form-control form-control-sm" required name="price_currency" disabled>
                    <ul>
                        <option value="">Currency</option>
                        {% for currency in currencies %}
                            <option value="{{ currency }}">{{ currency }}</option>
                        {% endfor %}
                    </ul>
                </select>
                <input class="form-control form-control-sm" required type="number" name="price" placeholder="Price">
            </div>
            <div class="form-group form-group-currency">
                <select id="costs-currency" class="form-control form-control-sm" required name="costs_currency">
                    <ul>
                        <option value="">Currency</option>
                        {% for currency in currencies %}
                            <option value="{{ currency }}">{{ currency }}</option>
                        {% endfor %}
                    </ul>
                </select>
                <input class="form-control form-control-sm" required type="number" name="costs" placeholder="Costs">
            </div>
            <div class="form-group">
                <input type="hidden" name="previous" value="{{ previous }}">
            </div>
            <!-- TODO: Implement date picker -->
            <div class="add-form-buttons">
                <input class="btn btn-primary" type="submit" value="Add">
                <a class="btn btn-primary" href="{% url 'portfolios' portfolio.id %}">Cancel</a>
            </div>
        </form>
    </div>

    <script>
    function toggleCustomInput() {
        // NOTE: This is copied code from add_stock.html, which can be altered for use here
        const exchange = document.getElementById("exchange");
        const new_exchange = document.getElementById("new-exchange");
        const currency = document.getElementById("currency");
        const new_currency = document.getElementById("new-currency");

        // Only show if "other" is selected
        new_exchange.type = (exchange.value === "other") ? "text" : "hidden";
        new_currency.type = (currency.value === "other") ? "text" : "hidden";
    }

    function setCurrency(element) {
        // Get selected element and currency attribute
        const selection = element.options[element.selectedIndex];
        const currency = selection.getAttribute('data-currency');

        // Get currency elements
        const price_currency = document.getElementById("price-currency");
        const costs_currency = document.getElementById("costs-currency");

        // Update currency dropdowns based on stock currency
        price_currency.value = currency ? currency : "Currency";
        costs_currency.value = currency ? currency : "Currency";
    }
    </script>

{% endblock %}
