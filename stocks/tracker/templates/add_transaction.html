{% extends "layout.html" %}

{% block body %}

    <div id="add-form">

        {% if message %}
            <label class="col-form-label-sm error-label" for="error-message">An error occurred:</label>
            <div id="error-message" class="error-message">{{ message }}</div>
        {% endif %}

        <form action="{% url 'add_transaction' portfolio.id %}" method="post">
            {% csrf_token %}
            <label class="col-form-label-lg">Add transaction</label>
            <div class="form-group">
                <input class="form-control form-control-sm" type="text" name="portfolio" value="{{ portfolio.name }}" readonly>
            </div>
            <div class="form-group">
                <select id="transaction-type" class="form-control form-control-sm" required name="transaction_type" onchange="toggleCustomInput()">
                    <ul>
                        <option value="StockTransaction">Stock transaction</option>
                        <option value="FiatTransaction">Fiat transaction</option>
                    </ul>
                </select>
            </div>
            <div class="form-group">
                <select id="stock" class="form-control form-control-sm" required name="stock_id" onchange="setCurrency(this)">
                    <ul>
                        <option value="">Select stock</option>
                        {% for stock in stocks %}
                            <option value="{{ stock.id }}" data-currency="{{ stock.currency }}">{{ stock.name }}</option>
                        {% endfor %}
                    </ul>
                </select>
            </div>
            <div class="form-group form-group-radio">
                <input id="buy" required type="radio" name="buy" value="buy" checked>
                <label id="buy-label" class="btn btn-primary" for="buy" onclick="toggleStockTransaction()">Buy</label>
                <input id="sell" required type="radio" name="buy" value="sell">
                <label id="sell-label" class="btn btn-primary" for="sell" onclick="toggleStockTransaction()">Sell</label>
                <input id="deposit" required type="radio" name="deposit" value="deposit">
                <label id="deposit-label" class="btn btn-primary" for="deposit" hidden onclick="toggleFiatTransaction()">Deposit</label>
                <input id="withdrawal" required type="radio" name="deposit" value="withdrawal">
                <label id="withdrawal-label" class="btn btn-primary" for="withdrawal" hidden onclick="toggleFiatTransaction()">Withdrawal</label>
            </div>
            <div class="form-group">
                <input class="form-control form-control-sm" required type="number" min="0" step="0.01" name="amount" placeholder="Amount">
            </div>
            <div id="price" class="form-group form-group-currency">
                <input id="price-currency"  class="form-control form-control-sm" required type="text" name="price_currency" value="Currency" disabled>
                <input class="form-control form-control-sm" required type="number" min="0" step="0.01" name="price" placeholder="Price">
            </div>
            <div class="form-group form-group-currency">
                <select id="costs-currency" class="form-control form-control-sm" required name="costs_currency">
                    <ul>
                        <option value="Currency">Currency</option>
                        {% for currency in currencies %}
                            <option value="{{ currency }}">{{ currency }}</option>
                        {% endfor %}
                    </ul>
                </select>
                <input class="form-control form-control-sm" required type="number" min="0" step="0.01" name="costs" placeholder="Costs">
            </div>
            <div class="form-group">
                <input type="hidden" name="previous" value="{{ previous }}">
            </div>
            <!-- TODO: Implement date picker -->
            <div class="add-form-buttons">
                <input class="btn btn-primary" type="submit" value="Add">
                <a class="btn btn-primary" href="{% url 'portfolios' portfolio.id %}">Cancel</a>
            </div>
        </form>
    </div>

    <script>
    function toggleCustomInput() {
        // Get transaction type
        const transaction_type = document.getElementById("transaction-type");

        // Get dependent elements
        const stock = document.getElementById("stock");
        const price = document.getElementById("price");
        const buy = document.getElementById("buy-label");
        const sell = document.getElementById("sell-label");
        const deposit = document.getElementById("deposit-label");
        const withdrawal = document.getElementById("withdrawal-label");

        // Toggle hidden and checked attributes for all radio buttons
        if (transaction_type.value === "StockTransaction") {
            stock.hidden = false;
            price.hidden = false;
            buy.hidden = false;
            sell.hidden = false;
            deposit.hidden = true;
            withdrawal.hidden = true;
            buy.control.checked = true;
            sell.control.checked = false;
            deposit.control.checked = false;
            withdrawal.control.checked = false;
        } else {
            stock.hidden = true;
            price.hidden = true;
            buy.hidden = true;
            sell.hidden = true;
            deposit.hidden = false;
            withdrawal.hidden = false;
            buy.control.checked = false;
            sell.control.checked = false;
            deposit.control.checked = true;
            withdrawal.control.checked = false;
        }
    }

    function toggleStockTransaction() {
        // Get radio buttons
        const buy = document.getElementById("buy");
        const sell = document.getElementById("sell");

        // Toggle buttons
        buy.checked = !buy.checked;
        sell.checked = !sell.checked;
    }

    function toggleFiatTransaction() {
        // Get radio buttons
        const deposit = document.getElementById("deposit");
        const withdrawal = document.getElementById("withdrawal");

        // Toggle buttons
        deposit.checked = !deposit.checked;
        withdrawal.checked = !withdrawal.checked;
    }

    function setCurrency(element) {
        // Get selected element and currency attribute
        const selection = element.options[element.selectedIndex];
        const currency = selection.getAttribute('data-currency');

        // Get currency elements
        const price_currency = document.getElementById("price-currency");
        const costs_currency = document.getElementById("costs-currency");

        // Update currency dropdowns based on stock currency
        price_currency.value = currency ? currency : "Currency";
        costs_currency.value = currency ? currency : "Currency";
    }
    </script>

{% endblock %}
