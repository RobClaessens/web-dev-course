<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Google Image Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div>
            <a class="refs" href="index.html">Google Search</a>

            <img class="logo" src="google_images_logo.png" alt="Google Images">

            <form class="search" action="https://www.google.com/search">
                <div class="search_box">
                    <img class="icon" src="search_icon.png" alt="">
                    <input class="text" type="text" name="q">
                    <img class="icon" src="camera_icon.png", alt="">
                </div>
                <input type="hidden" name="tbm" value="isch">
                <input class="search_button" type="submit" value="Google Image Search">
            </form>
        </div>
    </body>
</html>
