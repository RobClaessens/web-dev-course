{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia - Search results
{% endblock %}

{% block body %}
    <h1>Search results</h1>

    <ul>
        {% for entry in entries %}
            <li> <a href="{% url 'show_page' title=entry %}">{{ entry }}</a> </li>
        {% endfor %}
    </ul>

{% endblock %}
