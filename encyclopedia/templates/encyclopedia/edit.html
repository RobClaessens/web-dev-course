{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia - Edit page
{% endblock %}

{% block body %}
    <h1>Edit Page</h1>

    <form action="{% url 'edit_page' title=title %}" method="post">

        {% csrf_token %}

        {{ form }}

        <input name="button" type="submit" value="Save page">

    </form>

{% endblock %}
