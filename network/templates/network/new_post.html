{% extends "network/layout.html" %}

{% block body %}

    <h2>New post</h2>

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}

    <form action="{% url 'new_post' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <input class="form-control" autofocus type="text" name="text" placeholder="...">
        </div>
        <input class="btn btn-primary" type="submit" name="cancel" value="Cancel">
        <input class="btn btn-primary" type="submit" name="post" value="Post">
    </form>

{% endblock %}
