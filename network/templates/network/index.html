{% extends "network/layout.html" %}

{% block body %}
    {% for post in posts %}
        <div class="post">
            <div class="text">
                {{ post.text }}
            </div>
            <div class="info">
                <b> {{ post.user.username }} </b>
                <br>
                <small><i> {{ post.created }} </i></small>
            </div>
        </div>
    {% endfor %}
{% endblock %}
